name: Test

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

# Tests only read the repository.
permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install bats
        run: sudo apt-get install -y bats
      - name: Run unit tests
        run: bats tests/unit-cdot.bats
